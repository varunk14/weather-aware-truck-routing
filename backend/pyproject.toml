[project]
name = "clearway-api"
version = "0.1.0"
description = "API for Clearway, a weather-aware truck route planner."
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16",
  "django-cors-headers>=4.9",
  "gunicorn>=23",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "django-stubs[compatible-mypy]>=5.2,<5.3",
  "djangorestframework-stubs>=3.16",
  "hypothesis>=6.170.5",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6",
  "pytest-django>=4.11",
  "ruff>=0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "B", "UP", "S", "C4", "SIM", "RET", "PT", "DJ", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^\\.venv/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["config", "routing"]
# dev and prod settings load in separate processes; prod is verified by
# tests/test_production_settings.py running `manage.py check --deploy`.
omit = ["config/wsgi.py", "config/settings/dev.py", "config/settings/prod.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
